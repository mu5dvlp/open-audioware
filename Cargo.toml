[workspace]
resolver = "3"
members = [
    "crates/mw-core",
    "crates/mw-backend",
    "crates/mw-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 🔴 このプロジェクト自身は MIT-0(MIT No Attribution)。**利用者に著作権表示の保持を求めない。**
# 判断の背景と、利用者が実際に負う義務(= 依存クレート側の表記義務)は LICENSE / THIRD-PARTY-LICENSES.md
# および README の「ライセンス」節を参照。ここを変えるときは3箇所とも揃えること
# (Cargo.toml / unity/package.json / LICENSE)。
license = "MIT-0"
publish = false
repository = "https://github.com/mu5dvlp/open-audioware"

[profile.release]
# リアルタイムオーディオコールバックの性能を優先する。
# panic=abort は FFI 境界での catch_unwind と両立しないため既定(unwind)のままにする。
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

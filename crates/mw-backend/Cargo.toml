[package]
name = "mw-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "出力デバイス抽象(Backend trait)と cpal 実装"

[lib]
crate-type = ["rlib"]

[dependencies]
mw-core = { path = "../mw-core" }
cpal = "0.18"

# AVAudioSession(カテゴリ・I/O バッファ長)を Rust から設定するために使う。
# cpal 0.18 が iOS 実装で既に依存しているクレートなので、依存ツリーは増えない。
# 詳細は crates/mw-backend/src/ios_session.rs を参照。
[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies.objc2-avf-audio]
version = "0.3"
features = ["std", "AVAudioSession", "AVAudioSessionTypes"]
default-features = false

# `host_time::host_time_ns`(初期構築仕様『§4.4』)が `mach_absolute_time` /
# `mach_timebase_info` を cpal 0.18.1 の CoreAudio 実装(`host_time_to_stream_instant`)と
# 完全に同じ式で呼ぶために使う。cpal 自身が macOS/iOS/tvOS で `mach2 0.6` に依存済みなので
# (`Cargo.lock` で確認済み)、バージョンを揃えてある限り依存ツリーは増えない。
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
mach2 = "0.6"

# `host_time::host_time_ns` が `clock_gettime(CLOCK_MONOTONIC)` を呼ぶために使う
# (Android / Linux。cpal の AAudio 実装〔`now_stream_instant`〕と同じ式)。
# `libc` は cpal 自身も依存しているクレートなので、依存ツリーは増えない。
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "tvos")))'.dependencies]
libc = "0.2"

# Android では cpal(AAudio 実装)が Java 側の AudioManager を参照するため、
# JavaVM / Context を ndk_context へ登録する必要がある(src/android_context.rs 参照)。
# どちらも cpal 0.18 の Android 実装が既に依存しているクレートなので、依存ツリーは増えない。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

# cpal の `realtime` フィーチャは Android では **AAudio の performance mode を LowLatency に
# する**唯一のスイッチ(既定では設定されず、AAudio が大きめのバッファを選ぶ)。
# 2026-08-23 の実機計測で、無効時のコールバックバッファが 886 frames = 18.5ms だったのに対し、
# 端末の FastMixer は 192 frames = 4.0ms で回っていた(docs/measurement-m1.md §6.2)。
# 併せて音声コールバックスレッドの優先度も上げる。
cpal = { version = "0.18", features = ["realtime"] }

[dev-dependencies]

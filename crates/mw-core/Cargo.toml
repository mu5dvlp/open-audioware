[package]
name = "mw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OS 非依存のミキサ・ボイス管理・クロック・デコード・リサンプルコア(オフラインレンダリング可能)"

[lib]
# unity-sample の csbindgen 経由テストや将来のホスト側ベンチから素直にリンクできるよう rlib のみ。
crate-type = ["rlib"]

[dependencies]
# SPSC ロックフリーリングバッファは `mw-core::ring_buffer` に実装する。
# 楽曲は `wav.rs` の自前 PCM パーサでストリーミングデコードする。
# サンプルレート変換(初期構築仕様 §4.7, M2)も `resample.rs` の自前ポリフェーズ窓付き
# sinc フィルタで行う(依存排除ステップ2。旧 `rubato` 依存は削除した。ADR-0004)。
# 外部の音声処理クレートには依存していない。

[dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

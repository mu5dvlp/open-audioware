[package]
name = "mw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OS 非依存のミキサ・ボイス管理・クロック・デコード・リサンプルコア(オフラインレンダリング可能)"

[lib]
# unity-sample の csbindgen 経由テストや将来のホスト側ベンチから素直にリンクできるよう rlib のみ。
crate-type = ["rlib"]

[dependencies]
# SPSC ロックフリーリングバッファは `mw-core::ring_buffer` に実装する。
# 楽曲のストリーミングデコード(初期構築仕様 §4.7, M7)。wav(PCM)/ ogg vorbis のみを
# 使うため default-features を切り、必要な feature だけを有効化する(依存ツリーを
# 無用に太らせない。§7.1 の実装方針)。opus 等の将来コーデック追加は MU2 の判断を待つ。
symphonia = { version = "0.6", default-features = false, features = [
    "wav",
    "ogg",
    "vorbis",
    "pcm",
] }
# サンプルレート変換(初期構築仕様 §4.7, M2)。既定 feature(`fft_resampler` のみ)を
# そのまま使う: 楽曲ストリーミングの `Fft` + `FixedSync::Both`(§7.1 の実装方針どおり依存を
# 無用に太らせない範囲で、既に必要な feature と一致するため明示的な取捨選択は不要)、
# SE ロード時一括変換の `Async` sinc はどちらも feature フラグ無しで使える。
# `resample.rs` の選定理由コメントを参照。
rubato = "5.0"

[dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

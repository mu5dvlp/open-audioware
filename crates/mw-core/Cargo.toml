[package]
name = "mw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OS 非依存のミキサ・ボイス管理・クロック・デコード・リサンプルコア(オフラインレンダリング可能)"

[lib]
# unity-sample の csbindgen 経由テストや将来のホスト側ベンチから素直にリンクできるよう rlib のみ。
crate-type = ["rlib"]

[dependencies]
# SPSC ロックフリーリングバッファ。コマンドキュー(ゲーム→音声スレッド)と
# 回収キュー(音声→ゲームスレッド、Arc<SoundData> の解放をゲームスレッド側へ戻す)に使う
# (初期構築仕様 §7.1, §5.2)。
rtrb = "0.3"

[dev-dependencies]

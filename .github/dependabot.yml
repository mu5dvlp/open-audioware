# Dependabot(依存更新の見張り)。2026-09-11 導入。
#
# 🔴 **これは設定ファイルであってワークフローではない。** GitHub 側で動くので
# Actions の実行時間を消費しない。
#
# 📌 `cargo-deny`(`make lint` / CI)は**既知の脆弱性とライセンス**を見ているが、
# 「新しいバージョンが出たこと」自体は見ていない。両方あって初めて追随できる。
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns:
          - "*"
    # 🔴 `mach2` は cpal が依存している版に揃える(mw-backend/Cargo.toml のコメント。
    #    二重に入ると依存ツリーが増えるうえ、`mach_timebase_info` を cpal と同じ実装で呼ぶ前提が崩れる)。
    #    2026-09-26 の PR #2 で 0.7 へ上げられたが、cpal 0.18.2 は 0.6 のままなので据え置いた。
    #    cpal が上げたら手で揃える。
    ignore:
      - dependency-name: "mach2"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    # 🔴 `dtolnay/rust-toolchain@<版>` は**タグの値がそのまま Rust の版**になる(`1.98.0` は意図した固定)。
    #    2026-09-11 に Dependabot が `@1.120.0`(存在しない Rust)へ上げて CI が全滅した。
    #    Rust の版はプロジェクトの判断で上げるので、ここでは追わない。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

# Dependabot(依存更新の見張り)。
#
# 🔴 **これは設定ファイルであってワークフローではない。** GitHub 側で動くので
# Actions の実行時間を消費しない。
#
# 📌 `cargo-deny`(`make lint` / CI)は**既知の脆弱性とライセンス**を見ているが、
# 「新しいバージョンが出たこと」自体は見ていない。両方あって初めて追随できる。
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # 公開されたばかりのバージョンは悪意のあるコードや不安定さが混入している可能性がある
    # ため、7日待ってから PR を出す(Semgrep CE package_managers.dependabot 検知。
    # セキュリティ更新はこの cooldown に従わず即座に来る)。
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
    # 🔴 `mach2` は cpal が依存している版に揃える(mw-backend/Cargo.toml のコメント。
    #    二重に入ると依存ツリーが増えるうえ、`mach_timebase_info` を cpal と同じ実装で呼ぶ前提が崩れる)。
    #    cpal 0.18.2 が 0.6 のままなので、mach2 も 0.6 に据え置く。
    #    cpal が上げたら手で揃える。
    ignore:
      - dependency-name: "mach2"
      # cpal は 0.18.1 に固定(iOS の playback タイムスタンプの意味が 0.18.2 で変わるため。
      # crates/mw-backend/Cargo.toml のコメント参照)。上げるときは手で。
      - dependency-name: "cpal"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    # 🔴 `dtolnay/rust-toolchain@<版>` は**タグの値がそのまま Rust の版**になる(`1.98.0` は意図した固定)。
    #    `@stable` や存在しない Rust のタグへ自動更新すると CI が壊れるため、ここでは追わない。
    #    Rust の版はプロジェクトの判断で上げるので、ここでは追わない。
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

name: CI

# 初期構築仕様 §9: 4ターゲット(Linux 検証 / macOS dylib / iOS xcframework /
# Android .so)の検証を毎 push で回す。バイナリ配布(Release 添付)はタグ時のみ
# (M0 ではリリースジョブ自体を作らない)。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# どのジョブも push / 書き込みを行わない(ビルド検証・テスト・秘密情報検知のみ)ため、
# 読み取りのみに絞る(zizmor 対応)。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu: fmt / clippy / cargo-deny / cargo test
  # (mw-core のオフラインレンダリングはデバイス無しでテストできる。§8)
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ALSA dev headers (cpal の Linux ビルドに必要)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # 🔴🔴 **CI ではオーディオデバイスを用意しない。**
      #
      # 動機: 同じテスト一式が**実デバイスのあるマシンでは TOTAL 95.84%**
      # (handle.rs 83.04% / ffi.rs 98.15%)なのに、**CI では handle.rs 13% / ffi.rs 49%**。
      # CI にデバイスが無いと `CpalBackend::open()` が失敗 → `mw_init` が `Failed` を返し、
      # ffi.rs の統合テストが `mw_init` 成功後に続ける一連(SE / 楽曲 / BGM / イベント /
      # 再オープン)が**丸ごと未到達**になるため。**テストは書けていて、CI が実行できていない。**
      #
      # ## 試した3案と、落ちた場所(すべて実測)
      #
      # 1. ❌ **ALSA の `null` PCM**($HOME/.asoundrc で既定を差し替え)——
      #    ストリームは開ける。しかし `null` は書き込みを捨てるだけで**クロックを持たない**ため
      #    **音声コールバックが回らない**。投入した再生コマンドが掃かれず
      #    `state: Ready / song_frames: 0` のまま 5 秒待ってタイムアウト。
      # 2. ❌ **`snd-dummy` カーネルモジュール** —— GitHub の ubuntu runner では
      #    `modprobe` できない(`/dev/snd/controlC0` が生えず、
      #    `linux-modules-extra-$(uname -r)` も入らない)。
      # 3. ❌ **PulseAudio の null sink**(`pactl load-module module-null-sink` + `pcm.!default {
      #    type pulse }`)—— **シンク自体は立ち上がる**(ログに `ci_dummy ... IDLE` が出る)。
      #    cpal もストリームを開ける。しかし**やはりコールバックが回らず**、1 と同じ
      #    `state: Ready / song_frames: 0` で落ちた(シンクが IDLE のままなのが傍証)。
      #
      # ## 結論
      #
      # 🔴 **CI のカバレッジの数字(total)は、この構成では構造的に低い。** それを是として運用する:
      # **見るのは `codecov.yml` の `patch`(新しく書いた行)**。total は手元で
      # `cargo llvm-cov --workspace --summary-only` を回して確認する(実デバイスがあるので正確)。
      # ⚠️ **数字を上げるために薄いテストを足さないこと** —— 足りないのはテストではない。
      #
      # 📌 この探索の副産物として、`ffi.rs` のアンダーラン検証が環境依存だった潜在 flaky を
      # 1件見つけて直してある(番兵で「書き込まれたこと」だけを見る形へ)。

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          # llvm-tools-preview は cargo-llvm-cov(カバレッジ計測)が要求する。
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      # 🔴 **`cargo test` の置き換え**(Codecov 導入)。
      # `cargo llvm-cov` は「テストを走らせたうえで計測する」ので、これ1本で
      # 従来の `cargo test --workspace` と同じ検証になる。
      # ⚠️ **`cargo test` を別ステップとして残さないこと** —— 同じテストが2回走り、
      # ワークスペース COMMON.md の「CI はコーヒー基準(3〜5分)」を確実に割る。
      # ⚠️ **`--all-features` は付けない** —— 従来の `cargo test --workspace` と
      # 検証範囲を変えないため(ゲートの意味を静かに広げない)。
      # 📌 計装ビルドは `Swatinem/rust-cache` のキャッシュに乗らない(プロファイルが
      # 違うので別アーティファクトになる)。所要がコーヒー基準を割るようなら、
      # このジョブを `on: push` から外して schedule(週次)+ workflow_dispatch へ回す。
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@27cdd3237bf9a6a2b668f3bcbfaa06949ae17deb # cargo-llvm-cov

      - name: cargo llvm-cov (テスト実行 + カバレッジ計測)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # 🔴 P3-8: 手書きの C# ラッパ(unity/Runtime/MwNative.cs)を Unity 無しで
      # コンパイルする。ここまでの cargo ステップは Rust 側しか見ておらず、
      # C# 側のフィールド名・型・シグネチャのズレは**一切検出できない**
      # (Unity のテストは CI で回さない方針なので、他に見る場所が無い)。
      #
      # ⚠️ **cargo のビルドを伴うステップ(いまは cargo llvm-cov)より後に置くこと。**
      # 検査対象の unity/Runtime/Generated/NativeMethods.g.cs は crates/mw-ffi/build.rs が
      # 生成する成果物で、リポジトリには入っていない(.gitignore)。
      # 📌 build.rs の出力先はリポジトリ内の固定パスなので、cargo llvm-cov の
      # 計装ビルド(target/llvm-cov-target)へ切り替わっても生成されること自体は変わらない。
      # 📌 3秒で終わるのでコーヒー基準を壊さない。Makefile と二重に書かないため
      # `make csharp-check` を呼ぶ(既定分岐と UNITY_IOS 分岐の両方を見る)。
      - name: Setup .NET (C# ラッパのコンパイル検査用)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: make csharp-check
        run: make csharp-check

  # Miri: mw-core の unsafe(自前のロックフリーリングバッファ)とパーサ(wav / decode / stream)を
  # 未定義動作の観点で検査する(ADR-0003)。範囲と nightly の日付は Makefile(MIRI_CI_FILTER /
  # MIRI_TOOLCHAIN)だけが持ち、ここには書かない(`make miri` が無ければ導入する)。
  # mw-core は cpal を使わないので ALSA は要らない。
  # ⚠️ コーヒー基準: テスト本体は約2分。Miri の sysroot(~/.cache/miri)を毎回作り直すと数分足すので
  # キャッシュする。基準を割るようなら on: push から外して schedule(週次)+ workflow_dispatch へ回す。
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # stable の lint-test とは別のツールチェーン・別の成果物なのでキャッシュを分ける。
          key: miri

      - name: Cache the Miri sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: make miri
        run: make miri

  # cargo-fuzz: 既存コーパスの回帰実行だけ(ADR-0003 の2段目)。
  # 🔴 コーパスの回帰だけ。長時間の実行は載せない(コーヒー基準)——週1回の長時間実行は
  # 別ワークフロー(.github/workflows/fuzz-weekly.yml)で行う。
  # nightly の日付は Makefile(NIGHTLY_TOOLCHAIN)だけが持つ(`fuzz-toolchain` が
  # `rustup toolchain install` で導入する)。cargo-fuzz 本体は install-action が先に入れるため、
  # `make fuzz-corpus` の中の `cargo install cargo-fuzz` 分岐(`fuzz-toolchain`)は走らない。
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
          workspaces: fuzz

      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz

      - name: make fuzz-corpus
        run: make fuzz-corpus

  # macos: .dylib(Unity Editor 用)+ xcframework(iOS)
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: make build-macos
        run: make build-macos

      - name: make build-ios
        run: make build-ios

      - name: Upload build artifacts (デバッグ用。Release 添付ではない)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-ios-native
          path: |
            unity/Runtime/Plugins/macOS/libmw_ffi.dylib
            unity/Runtime/Plugins/iOS/MwFfi.xcframework
          retention-days: 7

  # android: cargo-ndk でのクロスビルド検証(リンクまで)
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build .so (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -P 26 build -p mw-ffi --release

      - name: Upload build artifact (デバッグ用。Release 添付ではない)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native
          path: target/aarch64-linux-android/release/libmw_ffi.so
          retention-days: 7

  # 秘密情報のコミット検知。
  # 🔴 private リポジトリでは GitHub の secret scanning は GitHub Advanced Security(有料)が
  # 要るため無料では効かない。⚠️ このリポジトリは**将来 UPM パッケージとして配布する**予定で、
  # 履歴ごと配られる —— 入ってしまった鍵は消せない。
  # 🔴 **検査の定義は Makefile 1箇所**(`make gitleaks`)。⚠️ `fetch-depth: 0` が必須
  # (浅いクローンだと「過去にコミットされた鍵」を取りこぼして緑になる)。
  gitleaks:
    # @v1 は意図的な可動タグ(互換を保つ修正は運用側がタグを前へ動かす)。
    # zizmor: ignore[unpinned-uses]
    uses: mu5dvlp/ci-workflows/.github/workflows/gitleaks.yml@v1

name: CI

# 初期構築仕様 §9: 4ターゲット(Linux 検証 / macOS dylib / iOS xcframework /
# Android .so)の検証を毎 push で回す。バイナリ配布(Release 添付)はタグ時のみ
# (M0 ではリリースジョブ自体を作らない)。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu: fmt / clippy / cargo-deny / cargo test
  # (mw-core のオフラインレンダリングはデバイス無しでテストできる。§8)
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA dev headers (cpal の Linux ビルドに必要)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: cargo test
        run: cargo test --workspace

  # macos: .dylib(Unity Editor 用)+ xcframework(iOS)
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: make build-macos
        run: make build-macos

      - name: make build-ios
        run: make build-ios

      - name: Upload build artifacts (デバッグ用。Release 添付ではない)
        uses: actions/upload-artifact@v7
        with:
          name: macos-ios-native
          path: |
            unity/Runtime/Plugins/macOS/libmw_ffi.dylib
            unity/Runtime/Plugins/iOS/MwFfi.xcframework
          retention-days: 7

  # android: cargo-ndk でのクロスビルド検証(リンクまで)
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # `@stable` は rust-toolchain.toml を読まず常に最新 stable を入れてしまい、
        # ローカル(ファイル固定)と CI(常に最新)がズレて事故る(実際に2回発生した)。
        # バージョンはリポジトリ直下の rust-toolchain.toml と手で合わせること。
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build .so (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -P 26 build -p mw-ffi --release

      - name: Upload build artifact (デバッグ用。Release 添付ではない)
        uses: actions/upload-artifact@v7
        with:
          name: android-native
          path: target/aarch64-linux-android/release/libmw_ffi.so
          retention-days: 7

  # 秘密情報のコミット検知(2026-09-10 追加)。
  # 🔴 private リポジトリでは GitHub の secret scanning は GitHub Advanced Security(有料)が
  # 要るため無料では効かない。⚠️ このリポジトリは**将来 UPM パッケージとして配布する**予定で、
  # 履歴ごと配られる —— 入ってしまった鍵は消せない。
  # 🔴 **検査の定義は Makefile 1箇所**(`make gitleaks`)。⚠️ `fetch-depth: 0` が必須
  # (浅いクローンだと「過去にコミットされた鍵」を取りこぼして緑になる)。
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout(履歴全体)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: make gitleaks
        run: make gitleaks

name: Fuzz (weekly)

# ADR-0003 の2段目: cargo-fuzz の長時間実行はコーヒー基準を割るため push の CI には載せない
# (.github/workflows/ci.yml の fuzz ジョブはコーパスの回帰実行だけ)。ここでは週1回の
# 定期実行と、手動実行(workflow_dispatch)だけを行う。open-audioware は public リポジトリで
# Actions は無料だが、push では動かさない(コーヒー基準は「待てる長さ」の話であって
# 「課金」の話ではないため)。

on:
  schedule:
    # 毎週土曜 18:00 UTC。
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: "1ターゲットあたりの実行秒数"
        required: false
        default: "900"

env:
  CARGO_TERM_COLOR: always

# fuzz の回帰実行のみで push / 書き込みは行わないため、読み取りのみに絞る(zizmor 対応)。
permissions:
  contents: read

jobs:
  fuzz-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wav_decode, wav_decoder_pump, resample]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
          workspaces: fuzz

      - uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz

      - name: make fuzz-run
        # workflow_dispatch の入力を `run:` に直接展開しない(shell injection 対策。
        # env 経由にすることでシェルの特殊文字をそのまま渡さない)。
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event.inputs.seconds || '900' }}
        run: make fuzz-run TARGET="$FUZZ_TARGET" SECONDS="$FUZZ_SECONDS"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
